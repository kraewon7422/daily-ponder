<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Ponder</title>
<meta name="description" content="A quote to ponder, today in history, and a tiny daily journal.">
<meta name="theme-color" content="#f3ede8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120e22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<script>try { const t = localStorage.getItem('ponder.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @property --c1 { syntax: '<color>'; inherits: true; initial-value: #ffb3c7; }
  @property --c2 { syntax: '<color>'; inherits: true; initial-value: #a9b6ff; }
  @property --c3 { syntax: '<color>'; inherits: true; initial-value: #9fe6d6; }
  @property --c4 { syntax: '<color>'; inherits: true; initial-value: #ffd9a3; }

  :root {
    --bg: #f3ede8;
    --ink: #221c33;
    --muted: #6e6784;
    --card: rgba(255, 255, 255, .52);
    --card-strong: rgba(255, 255, 255, .72);
    --line: rgba(34, 28, 51, .09);
    --field: rgba(255, 255, 255, .6);
    --accent: #6d55e8;
    --blob-op: .85;
    --grain-op: .07;
    --shadow: 0 10px 40px -12px rgba(60, 40, 110, .18);
    --serif: 'Fraunces', Georgia, 'Times New Roman', 'Noto Serif KR', 'Batang', 'Yu Mincho', 'Songti SC', serif;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Yu Gothic', 'Microsoft YaHei', sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120e22;
      --ink: #f1ecff;
      --muted: #a8a0c4;
      --card: rgba(30, 24, 52, .5);
      --card-strong: rgba(36, 29, 62, .78);
      --line: rgba(255, 255, 255, .08);
      --field: rgba(255, 255, 255, .06);
      --accent: #a996ff;
      --blob-op: .42;
      --grain-op: .05;
      --shadow: 0 10px 40px -12px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #120e22;
    --ink: #f1ecff;
    --muted: #a8a0c4;
    --card: rgba(30, 24, 52, .5);
    --card-strong: rgba(36, 29, 62, .78);
    --line: rgba(255, 255, 255, .08);
    --field: rgba(255, 255, 255, .06);
    --accent: #a996ff;
    --blob-op: .42;
    --grain-op: .05;
    --shadow: 0 10px 40px -12px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- living background: soft drifting color fields ---------- */
  .aurora {
    position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none;
    animation: palette 48s ease-in-out infinite alternate;
  }
  .aurora span {
    position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
    opacity: var(--blob-op); will-change: transform;
  }
  .aurora .b1 { background: radial-gradient(circle, var(--c1) 0%, transparent 62%); top: -25vmax; left: -20vmax; animation: d1 34s ease-in-out infinite alternate; }
  .aurora .b2 { background: radial-gradient(circle, var(--c2) 0%, transparent 62%); top: -15vmax; right: -30vmax; animation: d2 41s ease-in-out infinite alternate; }
  .aurora .b3 { background: radial-gradient(circle, var(--c3) 0%, transparent 62%); bottom: -35vmax; left: 5vmax; animation: d3 38s ease-in-out infinite alternate; }
  .aurora .b4 { background: radial-gradient(circle, var(--c4) 0%, transparent 62%); bottom: -30vmax; right: -15vmax; animation: d4 45s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform: translate(18vmax, 14vmax) scale(1.15); } }
  @keyframes d2 { to { transform: translate(-16vmax, 20vmax) scale(.9); } }
  @keyframes d3 { to { transform: translate(20vmax, -12vmax) scale(1.1); } }
  @keyframes d4 { to { transform: translate(-22vmax, -16vmax) scale(1.2); } }
  @keyframes palette {
    0%   { --c1: #ffb3c7; --c2: #a9b6ff; --c3: #9fe6d6; --c4: #ffd9a3; }
    33%  { --c1: #c9b2ff; --c2: #8fd3ff; --c3: #ffc2a8; --c4: #b8f0c8; }
    66%  { --c1: #ffc8a0; --c2: #f4a8d8; --c3: #a6c8ff; --c4: #d5c2ff; }
    100% { --c1: #9fe0e6; --c2: #ffb8b8; --c3: #c4b5ff; --c4: #ffe3a6; }
  }
  /* paper grain on top of the colors */
  .grain {
    position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: var(--grain-op);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  @media (prefers-reduced-motion: reduce) {
    .aurora, .aurora span { animation: none; }
  }

  /* ---------- layout ---------- */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
  .brand { font: 600 13px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .brand img { width: 22px; height: 22px; }
  .today { font: 400 clamp(30px, 5vw, 46px)/1.1 var(--serif); margin: 10px 0 4px; letter-spacing: -.01em; }
  .greet { color: var(--muted); margin: 0; }

  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    min-width: 0;
  }
  .card h2 { font: 600 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  :is(:lang(ko), :lang(ja), :lang(zh)) :is(.card h2, .tag) { letter-spacing: .02em; }
  .card h3 { font: 500 14px/1.3 var(--sans); margin: 18px 0 8px; }
  .card h3:first-of-type { margin-top: 0; }

  /* ---------- quote ---------- */
  .quote-card { padding: clamp(26px, 5vw, 48px); }
  .tag { display: inline-block; font: 500 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); color: var(--muted); }
  blockquote { margin: 18px 0 14px; font: 350 clamp(22px, 3.4vw, 34px)/1.35 var(--serif); letter-spacing: -.005em; text-wrap: pretty; }
  blockquote::before { content: '\201C'; } blockquote::after { content: '\201D'; }
  .cite { color: var(--muted); }
  .cite b { color: var(--ink); font-weight: 600; }
  .quote-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  #qFav[aria-pressed=true] { color: #d6457a; border-color: color-mix(in srgb, #d6457a 40%, transparent); }
  .fade { transition: opacity .35s ease; }
  .fade.out { opacity: 0; }

  /* ---------- controls ---------- */
  button, .btn, select {
    font: 500 13px/1.35 var(--sans); color: var(--ink); cursor: pointer;
    background: var(--field); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; display: inline-flex; align-items: center; gap: 6px;
    transition: background .2s, transform .1s;
  }
  select { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; }
  select option { color: #221c33; background: #fff; }
  button:hover, .btn:hover, select:hover { background-color: var(--card-strong); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--ink); color: var(--bg); border-color: transparent; }
  input[type=text] {
    width: 100%; font: 400 15px/1.4 var(--sans); color: var(--ink);
    background: var(--field); border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 14px; outline: none; transition: border-color .2s, background .2s;
  }
  input[type=text]:focus { border-color: var(--accent); background: var(--card-strong); }
  input::placeholder { color: var(--muted); opacity: .8; }
  .thought { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .thought label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 8px; }
  .hint { font-size: 12px; color: var(--muted); }

  /* ---------- mood ---------- */
  .moods { display: flex; gap: 8px; flex-wrap: wrap; }
  .moods button { font-size: 22px; width: 46px; height: 46px; padding: 0; justify-content: center; border-radius: 16px; }
  .moods button[aria-pressed=true] { background: var(--card-strong); border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .row { display: flex; gap: 10px; align-items: center; }
  .good { display: grid; gap: 8px; }
  .good .row span { color: var(--muted); font: 500 13px var(--sans); width: 14px; }
  .streak { font: 500 12px/1 var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--field); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; white-space: nowrap; transition: color .3s, border-color .3s; }
  .streak.flash { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  /* ---------- on this day ---------- */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button { padding: 6px 12px; font-size: 12px; }
  .tabs button[aria-selected=true] { background: var(--ink); color: var(--bg); }
  .events { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .events li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .events li:last-child { border-bottom: 0; }
  .yr { font: 500 17px/1.2 var(--serif); }
  .ago { display: block; font: 400 11px var(--sans); color: var(--muted); margin-top: 3px; }
  .events a { color: inherit; text-decoration: none; }
  .events a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .muted { color: var(--muted); }
  .more { margin-top: 12px; }
  .src-note { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }

  /* ---------- calendar ---------- */
  .cal-head { display: flex; align-items: center; gap: 8px; }
  .cal-head button { padding: 5px 10px; }
  .cal-title { font: 500 15px var(--serif); min-width: 120px; text-align: center; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .wd { font: 500 11px var(--sans); color: var(--muted); text-align: center; padding-bottom: 4px; }
  .cal .day {
    aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--field);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 500 11px var(--sans); color: var(--muted); padding: 0; gap: 1px; min-width: 0;
  }
  .cal .day .e { font-size: 17px; line-height: 1; }
  .cal .day.has { color: var(--ink); }
  .cal .day.is-today { border-color: var(--accent); }
  .cal .day.sel { box-shadow: 0 0 0 2px var(--accent); }
  .cal .day.empty { visibility: hidden; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* ---------- year in review ---------- */
  .year { display: grid; grid-template-columns: max-content repeat(31, 1fr); gap: 3px; align-items: center; }
  .year .m { font: 500 10px var(--sans); color: var(--muted); padding-right: 4px; }
  .year .c { aspect-ratio: 1; border-radius: 3px; background: var(--field); border: 1px solid var(--line); min-width: 0; }
  .year .c.w { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .year .c.is-today { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .year .c:not(.x) { cursor: pointer; }
  .year .c:not(.x):hover { transform: scale(1.35); }
  .year .c.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
  .year .c.x { visibility: hidden; }
  .yr-stats { display: grid; gap: 14px; margin-top: 18px; }
  .yr-stats .big { font: 400 26px/1.1 var(--serif); }
  .mix { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--field); border: 1px solid var(--line); }
  .mix span { height: 100%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); }
  .chip small { color: var(--muted); margin-left: 4px; }
  .label { font: 500 12px var(--sans); color: var(--muted); margin-bottom: 6px; }

  /* ---------- favorites ---------- */
  .favs { display: grid; gap: 8px; max-height: 460px; overflow-y: auto; }
  .fav { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 12px 14px; border-radius: 16px; background: var(--field); border: 1px solid var(--line); }
  .fav .t { font: 400 15px/1.4 var(--serif); cursor: pointer; }
  .fav .t:hover { color: var(--accent); }
  .fav .a { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .fav button { padding: 4px 9px; font-size: 12px; }

  /* ---------- entries ---------- */
  .entry { padding: 14px 16px; border-radius: 18px; background: var(--field); border: 1px solid var(--line); margin-top: 10px; }
  .entry .when { font: 500 15px var(--serif); margin-bottom: 6px; }
  .entry p { margin: 4px 0; }
  .entry ul { margin: 4px 0; padding-left: 18px; }
  .entry .q { font: italic 400 14px/1.4 var(--serif); color: var(--muted); }
  .empty-note { color: var(--muted); font-style: italic; font-family: var(--serif); }

  /* ---------- auth + footer ---------- */
  .auth { display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
  .auth img { width: 32px; height: 32px; border-radius: 50%; }
  .auth .name { font-size: 13px; color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
  footer .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: .3s; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; pointer-events: none; z-index: 5; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- today's read ---------- */
  .read-title { font: 400 clamp(22px, 2.6vw, 28px)/1.25 var(--serif); margin: 14px 0 6px; text-wrap: balance; }
  .read-by { color: var(--muted); font-size: 14px; }
  .read-why { font: italic 400 16px/1.5 var(--serif); margin: 14px 0 0; }
  a.btn { text-decoration: none; }
  .wide { grid-column: 1 / -1; }
  #theme { width: 36px; height: 36px; padding: 0; justify-content: center; font-size: 16px; }

  @media (max-width: 560px) {
    .wrap { padding: 20px 16px 48px; }
    header.top { flex-direction: column; }
    .card { padding: 20px; border-radius: 22px; }
    .card h2 { flex-wrap: wrap; row-gap: 10px; }
    .cal-title { min-width: 0; }
    .events li { grid-template-columns: 54px 1fr; }
    .year { gap: 2px; }
    .year .c { border-radius: 2px; border: 0; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div>
<div class="grain" aria-hidden="true"></div>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand"><img src="icon.svg" alt="">Daily Ponder</div>
      <h1 class="today" id="today"></h1>
      <p class="greet" id="greet"></p>
    </div>
    <div class="auth">
      <select id="lang" aria-label="Language"></select>
      <button id="theme"></button>
      <span class="auth" id="auth"></span>
    </div>
  </header>

  <!-- quote -->
  <section class="card quote-card">
    <div class="fade" id="quoteBox">
      <span class="tag" id="qField"></span>
      <blockquote id="qText" lang="en"></blockquote>
      <div class="cite">— <b id="qAuthor"></b><span id="qSource"></span></div>
    </div>
    <div class="quote-actions">
      <button id="qNext" data-t="another"></button>
      <button id="qBack" data-t="back" hidden></button>
      <button id="qFav" aria-pressed="false"></button>
      <button id="qShare" data-t="share"></button>
      <button id="qCopy" data-t="copy"></button>
    </div>
    <div class="thought">
      <label for="thought" data-t="thoughtLabel"></label>
      <input type="text" id="thought" maxlength="200" data-ph="thoughtPh">
    </div>
  </section>

  <div class="grid">
    <!-- on this day -->
    <section class="card">
      <h2><span data-t="otd"></span> <span class="muted" id="otdDate" style="text-transform:none;letter-spacing:0"></span></h2>
      <div class="tabs" role="tablist" id="otdTabs">
        <button role="tab" data-k="selected" data-t="highlights" aria-selected="true"></button>
        <button role="tab" data-k="events" data-t="events" aria-selected="false"></button>
        <button role="tab" data-k="births" data-t="born" aria-selected="false"></button>
        <button role="tab" data-k="deaths" data-t="died" aria-selected="false"></button>
      </div>
      <p class="src-note" id="otdNote" hidden></p>
      <ul class="events" id="otdList"></ul>
      <button class="more" id="otdMore" data-t="showMore" hidden></button>
    </section>

    <!-- scribbles -->
    <section class="card">
      <h2><span data-t="strokes"></span> <span class="streak" id="streak" hidden></span></h2>
      <h3 data-t="howAreYou"></h3>
      <div class="moods" id="moods"></div>
      <div style="margin-top:10px">
        <input type="text" id="word" maxlength="24" data-ph="wordPh">
      </div>
      <h3 data-t="oneLine"></h3>
      <input type="text" id="diary" maxlength="200" data-ph="diaryPh">
      <h3 data-t="threeGood"></h3>
      <div class="good">
        <div class="row"><span>1</span><input type="text" data-good="0" maxlength="80" data-ph="good1"></div>
        <div class="row"><span>2</span><input type="text" data-good="1" maxlength="80" data-ph="good2"></div>
        <div class="row"><span>3</span><input type="text" data-good="2" maxlength="80" data-ph="good3"></div>
      </div>
    </section>

    <!-- today's read -->
    <section class="card">
      <h2 data-t="todaysRead"></h2>
      <div class="fade" id="readBox">
        <span class="tag" id="rField"></span> <span class="tag" id="rKind"></span>
        <div class="read-title" id="rTitle" lang="en"></div>
        <div class="read-by" id="rBy"></div>
        <p class="read-why" id="rWhy" lang="en"></p>
      </div>
      <div class="quote-actions">
        <button id="rNext" data-t="anotherRead"></button>
        <a class="btn" id="rLink" target="_blank" rel="noopener" data-t="lookUp"></a>
      </div>
    </section>

    <!-- your past -->
    <section class="card">
      <h2 data-t="pastTitle"></h2>
      <div id="pastYou"></div>
    </section>

    <!-- mood calendar -->
    <section class="card">
      <h2><span data-t="moodCal"></span>
        <span class="cal-head"><button id="calPrev">‹</button><span class="cal-title" id="calTitle"></span><button id="calNext">›</button></span>
      </h2>
      <div class="cal" id="cal"></div>
      <div class="legend" id="legend"></div>
      <div id="dayDetail"></div>
    </section>

    <!-- favorites -->
    <section class="card">
      <h2><span data-t="favorites"></span> <span class="muted" id="favCount" style="letter-spacing:0"></span></h2>
      <div class="favs" id="favs"></div>
    </section>

    <!-- year in review -->
    <section class="card wide">
      <h2><span data-t="yearTitle"></span>
        <span class="cal-head"><button id="yrPrev">‹</button><span class="cal-title" id="yrTitle" style="min-width:60px"></span><button id="yrNext">›</button></span>
      </h2>
      <div class="year" id="year"></div>
      <div id="yrDetail"></div>
      <div class="yr-stats" id="yrStats"></div>
    </section>
  </div>

  <footer>
    <span id="status"></span>
    <span class="actions">
      <button id="exportBtn" data-t="export"></button>
      <button id="importBtn" data-t="import"></button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </span>
  </footer>

  }
  for (const k in out) out[k].sort((a, b) => b.y - a.y);
  // highlights: spread evenly across time (recent years have far more entries, so pick by year, not by position)
  const s = out.selected;
  if (s.length > 12) {
    const lo = s[s.length - 1].y, hi = s[0].y, used = new Set();
    for (let i = 0; i < 12; i++) {
      const target = lo + (hi - lo) * i / 11;
      let best = -1;
      s.forEach((x, j) => { if (!used.has(j) && (best < 0 || Math.abs(x.y - target) < Math.abs(s[best].y - target))) best = j; });
      used.add(best);
    }
    out.selected = [...used].sort((a, b) => a - b).map(j => s[j]);
  }
  return out;
}

async function loadHistory() {
  const wiki = T.wiki, ck = `ponder.otd.${wiki}.${MM}${DD}`;
  otd = null;
  $('#otdList').replaceChildren(el('li', {}, el('span'), el('span', { className: 'muted', textContent: T.loading })));
  $('#otdNote').hidden = !T.fromEnglish; $('#otdNote').textContent = T.fromEnglish;
  try {
    const page = DATE_PAGES[wiki];
    if (page) {
      const title = page.title(NOW.getMonth() + 1, NOW.getDate());
      const r = await fetch(`https://${wiki}.wikipedia.org/w/api.php?action=parse&format=json&formatversion=2&origin=*&prop=wikitext&page=${encodeURIComponent(title)}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const wt = (await r.json()).parse?.wikitext;
      if (!wt) throw new Error('no page');
      otd = parseDatePage(wt, page, wiki);
    } else if (wiki === 'zh') {
      // Chinese Wikipedia mixes scripts. Only the single-type feeds honor a Simplified request (the "all" feed ignores it).
      const get = async type => {
        const r = await fetch(`https://zh.wikipedia.org/api/rest_v1/feed/onthisday/${type}/${MM}/${DD}`, { headers: { 'Accept-Language': 'zh-hans' }, cache: 'no-cache' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return slim((await r.json())[type]);
      };
      const [selected, events, births, deaths] = await Promise.all(['selected', 'events', 'births', 'deaths'].map(get));
      otd = { selected, events, births, deaths };
    } else {
      const r = await fetch(`https://${wiki}.wikipedia.org/api/rest_v1/feed/onthisday/all/${MM}/${DD}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      otd = { selected: slim(j.selected), events: slim(j.events), births: slim(j.births), deaths: slim(j.deaths) };
    }
    try { localStorage.setItem(ck, JSON.stringify(otd)); } catch {}
  } catch (err) {
    try { otd = JSON.parse(localStorage.getItem(ck)); } catch {}
  }
  if (wiki !== T.wiki) return; // language changed while loading
  if (!otd) { $('#otdList').replaceChildren(el('li', {}, el('span'), el('span', { className: 'muted', textContent: T.otdFail }))); return; }
  // some editions have no "selected" list; fall back to all events
  if (!otd.selected.length) otd.selected = otd.events;
  renderHistory();
}
function renderHistory() {
  if (!otd) return;
  const list = otd[otdTab] || [];
  const year = NOW.getFullYear();
  $('#otdList').replaceChildren(...list.slice(0, otdCount).map(x => {
    const ago = year - x.y;
    const text = x.u ? el('a', { href: x.u, target: '_blank', rel: 'noopener', textContent: x.t }) : el('span', { textContent: x.t });
    return el('li', {}, el('span', { className: 'yr' }, String(x.y < 0 ? -x.y + ' ' + T.bc : x.y), el('span', { className: 'ago', textContent: ago > 0 ? T.yrsAgo(ago.toLocaleString(LANG)) : '' })), text);
  }));
  $('#otdMore').hidden = list.length <= otdCount;
}
$('#otdTabs').onclick = e => {
  const b = e.target.closest('button'); if (!b || !otd) return;
  otdTab = b.dataset.k; otdCount = 8;
  [...$('#otdTabs').children].forEach(x => x.setAttribute('aria-selected', x === b));
  renderHistory();
};
$('#otdMore').onclick = () => { otdCount += 8; renderHistory(); };

/* ---------------- export / import ---------------- */
$('#exportBtn').onclick = () => {
  const data = Object.fromEntries(Object.entries(entries).filter(([, e]) => !isEmpty(e)));
  const blob = new Blob([JSON.stringify({ app: 'daily-ponder', version: 2, exported: new Date().toISOString(), entries: data, favorites: favs.ids }, null, 2)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: `daily-ponder-${TODAY}.json` });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'daily-ponder' || typeof j.entries !== 'object') throw new Error('not a Daily Ponder file');
    let n = 0;
    for (const [k, v] of Object.entries(j.entries)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
      if (!entries[k] || (v.updated || 0) > (entries[k].updated || 0)) { entries[k] = v; n++; cloud.save(k); }
    }
    if (Array.isArray(j.favorites)) setFavs([...new Set([...favs.ids, ...j.favorites])]);
    persist(); renderAll(); toast(T.imported(n));
  } catch (err) { toast(T.importFail + err.message); }
  e.target.value = '';
};

/* ---------------- login + sync (Firebase, Google only) ---------------- */
const cloud = { save() {}, saveFavs() {} };
let renderAuth = () => {
  $('#auth').replaceChildren(el('button', { textContent: T.signIn, disabled: true, title: T.notSetup }));
};
async function initAuth() {
  if (!firebaseConfig) return renderAuth();
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js'),
  ]);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app), db = F.getFirestore(app);
  let user = null;
  const pending = new Map();
  const later = (key, fn) => {
    if (!user) return;
    clearTimeout(pending.get(key));
    pending.set(key, setTimeout(async () => {
      pending.delete(key);
      try { await fn(); setStatus('synced'); } catch (err) { setStatus('syncFail', err.code); }
    }, 800));
  };
  cloud.save = k => later(k, () => F.setDoc(F.doc(db, 'users', user.uid, 'days', k), entries[k]));
  cloud.saveFavs = () => later('favs', () => F.setDoc(F.doc(db, 'users', user.uid, 'meta', 'favorites'), favs));
  renderAuth = () => {
    const box = $('#auth');
    if (!user) {
      box.replaceChildren(el('button', { className: 'primary', textContent: T.signIn, onclick: () =>
        A.signInWithPopup(auth, new A.GoogleAuthProvider()).catch(err => toast(T.signFail + err.code)) }));
      return;
    }
    box.replaceChildren(
      user.photoURL ? el('img', { src: user.photoURL, alt: '', referrerPolicy: 'no-referrer' }) : '',
      el('span', { className: 'name', textContent: user.displayName || user.email }),
      el('button', { textContent: T.signOut, onclick: () => A.signOut(auth) }));
  };
  A.onAuthStateChanged(auth, async u => {
    user = u;
    renderAuth();
    if (!u) return setStatus('local');
    setStatus('syncing');
    try {
      const snap = await F.getDocs(F.collection(db, 'users', u.uid, 'days'));
      const remote = {};
      snap.forEach(d => { remote[d.id] = d.data(); });
      for (const [k, r] of Object.entries(remote)) if (!entries[k] || (r.updated || 0) > (entries[k].updated || 0)) entries[k] = r;
      for (const [k, e] of Object.entries(entries)) if (!isEmpty(e) && (!remote[k] || (e.updated || 0) > (remote[k].updated || 0))) cloud.save(k);
      const rf = (await F.getDoc(F.doc(db, 'users', u.uid, 'meta', 'favorites'))).data();
      if (rf && (rf.updated || 0) > (favs.updated || 0)) { favs = rf; persistFavs(); }
      else if (favs.updated) cloud.saveFavs();
      persist(); renderAll(); renderFavBtn();
      setStatus('synced');
    } catch (err) { setStatus('syncFail', err.code); }
  });
}

/* ---------------- theme ---------------- */
// Auto follows the system setting; Light/Dark override it. Stored per device.
const THEMES = ['auto', 'light', 'dark'], THEME_ICON = { auto: '◐', light: '☀', dark: '☾' };
let theme = document.documentElement.dataset.theme || 'auto';
function renderTheme() { const b = $('#theme'); b.textContent = THEME_ICON[theme]; b.title = b.ariaLabel = T.theme[theme]; }
$('#theme').onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  try { if (theme === 'auto') localStorage.removeItem('ponder.theme'); else localStorage.setItem('ponder.theme', theme); } catch {}
  renderTheme();
};

/* ---------------- today's read ---------------- */
// Links are the ones confirmed by the fact-check (Wikipedia article / DOI); otherwise a search.
const readDaily = (dayNum * 7907 + 13) % READS.length;
let readShown = readDaily;
const readLink = r => r.wp ? 'https://en.wikipedia.org/wiki/' + encodeURIComponent(r.wp.replace(/ /g, '_'))
  : r.doi ? 'https://doi.org/' + r.doi
  : r.k === 'book' || r.f === 'essay' ? 'https://en.wikipedia.org/wiki/Special:Search?search=' + encodeURIComponent(`${r.t} ${r.a}`)
  : 'https://scholar.google.com/scholar?q=' + encodeURIComponent(`"${r.t}" ${r.a}`);
function renderRead(animate) {
  const r = READS[readShown], box = $('#readBox');
  const apply = () => {
    $('#rField').textContent = T.fields[r.f] || r.f;
    $('#rKind').textContent = r.k === 'paper' ? T.paper : T.book;
    $('#rTitle').textContent = r.t;
    $('#rBy').textContent = [r.a, r.y < 0 ? -r.y + ' ' + T.bc : r.y, r.v].filter(Boolean).join(' · ');
    $('#rWhy').textContent = r.w;
    $('#rLink').href = readLink(r);
    box.classList.remove('out');
  };
  if (!animate) return apply();
  box.classList.add('out'); setTimeout(apply, 300);
}
$('#rNext').onclick = () => { let n; do { n = Math.floor(Math.random() * READS.length); } while (n === readShown && READS.length > 1); readShown = n; renderRead(true); };

/* ---------------- boot ---------------- */
function renderAll() { fillToday(); renderCalendar(); renderDetail(); renderPast(); renderStreak(); renderYear(); renderFavs(); }
showQuote(dailyIndex, false);
applyLang();
renderAll();
loadHistory();
initAuth().catch(err => { $('#auth').replaceChildren(el('span', { className: 'muted', textContent: T.offline })); console.error(err); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
// The installed app can stay open for days: when the date changes (e.g. past midnight), reload so writing goes to the new day.
// Never reload while someone is typing.
if (!override) {
  const checkDay = () => { if (keyOf(new Date()) !== TODAY && !document.activeElement?.matches('input')) location.reload(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
  setInterval(checkDay, 60 * 1000);
}
</script>
